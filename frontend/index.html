<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/Logo.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="canonical" href="https://www.soundmeet.app/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find musicians, join jams, and make music together." />
    <meta name="theme-color" content="#DC2E73" />
    <title>SoundMeet</title>

    <!-- Open Graph -->
    <meta property="og:title" content="SoundMeet" />
    <meta property="og:description" content="Find musicians, join jams, and make music together." />
    <meta property="og:image" content="https://www.soundmeet.app/og-banner.png" />
    <meta property="og:url" content="https://www.soundmeet.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SoundMeet" />
    <meta name="twitter:description" content="Find musicians, join jams, and make music together." />
    <meta name="twitter:image" content="https://www.soundmeet.app/og-banner.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SoundMeet",
      "url": "https://www.soundmeet.app",
      "logo": "https://www.soundmeet.app/logo.png",
      "description": "Find musicians, join jams, and make music together.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "cjames.marin03@gmail.com",
        "contactType": "customer support"
      }
    }
    </script>

    <!-- Structured Data: WebSite with search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SoundMeet",
      "url": "https://www.soundmeet.app",
      "description": "Find musicians, join jams, and make music together. Discover nearby jam sessions, live shows, and connect with local musicians.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.soundmeet.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SoundMeet",
      "url": "https://www.soundmeet.app",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "All",
      "description": "A platform for musicians to discover jam sessions, live shows, and other musicians nearby. Create or join jams, find bandmates, and coordinate through group chat.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Map-based jam and show discovery",
        "Create and host jam sessions",
        "Join open jam sessions",
        "Musician profile with instruments and genres",
        "Swipe-based musician matchmaking",
        "Group chat for jam coordination",
        "Activity feed",
        "Join a Band and Find a Bandmate listings"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
